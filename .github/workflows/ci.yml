name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q src tests
      - name: PR diff whitespace check
        shell: bash
        run: git diff --check HEAD^1 HEAD
      - name: Fake adapter smoke test
        shell: bash
        run: |
          state_dir="$(mktemp -d)"
          output="$(router run \
            --task "Return exactly ROUTER_MVP_OK" \
            --adapter-mode fake \
            --state-dir "$state_dir")"
          test "$output" = "ROUTER_MVP_OK"
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Fresh wheel Native lifecycle smoke
        shell: bash
        run: |
          wheel_env="$RUNNER_TEMP/router-wheel-env"
          python -m venv "$wheel_env"
          "$wheel_env/bin/python" -m pip install --no-deps dist/codex_router-*.whl

          native_home="$(mktemp -d)"
          "$wheel_env/bin/router" native-install \
            --codex-home "$native_home" > "$RUNNER_TEMP/native-install.json"
          "$wheel_env/bin/router" native-status \
            --codex-home "$native_home" > "$RUNNER_TEMP/native-status.json"
          "$wheel_env/bin/router" native-self-test \
            --codex-home "$native_home" > "$RUNNER_TEMP/native-self-test.json"
          "$wheel_env/bin/python" -c 'import json,sys; data=json.load(open(sys.argv[1])); assert data["state"] == "installed" and data["agents_managed"] and data["luna_agent_configured"] and not data["router_hooks_present"]' "$RUNNER_TEMP/native-status.json"
          "$wheel_env/bin/python" -c 'import json,sys; data=json.load(open(sys.argv[1])); assert data and all(data.values())' "$RUNNER_TEMP/native-self-test.json"
          "$wheel_env/bin/router" native-uninstall \
            --codex-home "$native_home" > "$RUNNER_TEMP/native-uninstall.json"
          "$wheel_env/bin/python" -c 'import json,sys; data=json.load(open(sys.argv[1])); assert data["state"] == "uninstalled"' "$RUNNER_TEMP/native-uninstall.json"

      - name: Historical compatibility smoke
        shell: bash
        run: |
          wheel_env="$RUNNER_TEMP/router-wheel-env"
          state_dir="$(mktemp -d)"
          output="$("$wheel_env/bin/router" run \
            --task "Return exactly ROUTER_MVP_OK" \
            --adapter-mode fake \
            --state-dir "$state_dir")"
          test "$output" = "ROUTER_MVP_OK"

          codex_home="$(mktemp -d)"
          policy_state="$(mktemp -d)"
          synthetic_codex="$RUNNER_TEMP/synthetic-codex"
          printf '%s\n' 'synthetic codex binary' > "$synthetic_codex"
          chmod 700 "$synthetic_codex"

          "$wheel_env/bin/router" global-install \
            --codex-home "$codex_home" \
            --state-dir "$policy_state" \
            --codex-bin "$synthetic_codex" > "$RUNNER_TEMP/router-install.json"
          "$wheel_env/bin/router" global-self-test \
            --codex-home "$codex_home" > "$RUNNER_TEMP/router-self-test.json"
          "$wheel_env/bin/python" -c 'import json,sys; data=json.load(open(sys.argv[1])); assert data["status"] == "pass"' "$RUNNER_TEMP/router-self-test.json"
          "$wheel_env/bin/router" global-uninstall \
            --codex-home "$codex_home" > "$RUNNER_TEMP/router-uninstall.json"
