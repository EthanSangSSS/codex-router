[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-router"
version = "0.1.0"
description = "Native-first Codex orchestration with PRIMARY planning and disposable Luna workers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
router = "codex_router.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
